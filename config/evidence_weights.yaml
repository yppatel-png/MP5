# ==============================================================
# Evidence Reliability Weights Configuration
# Higher weights represent higher confidence in student mastery
# ==============================================================

evidence_weights:
  # Official course grade or formal proctored diagnostic assessment
  grade: 1.0
  assessed_diagnostic: 1.0
  
  # Hands-on timed milestone, mock exam, or technical interview project
  timed_project: 0.9
  mock_exam: 0.9
  
  # Interactive module quiz, code submission, or practice exercise
  quiz: 0.7
  exercise: 0.7
  
  # Inferred capability derived from passing an accredited institute course
  inferred_course: 0.5
  
  # Self-reported interest or student-claimed proficiency (unverified)
  self_declared: 0.2

bkt_parameters:
  # Initial probability of knowing the skill before evidence
  p_init_default: 0.1
  # Probability of transitioning from unlearned to learned state
  p_transit_default: 0.2
  # Probability of slipping (making a mistake despite knowing the concept)
  p_slip_default: 0.1
  # Probability of guessing correctly without knowing the concept
  p_guess_default: 0.2
  # Mastery threshold probability
  mastery_threshold: 0.85
  # Minimum independent items required to confirm mastery
  min_items_required: 3
  # Minimum sessions required
  min_sessions_required: 2
  # Half life in days for Bayesian Knowledge Tracing time decay
  decay_half_life_days: 60.0

grade_scale:
  A: 0.90
  A-: 0.85
  B: 0.75
  B-: 0.68
  C: 0.52
  C-: 0.45
  D: 0.35
  E: 0.20
  F: 0.10
  provenance: "assumption"
  provenance_note: "assumed, pending ordinance"

diagnostic_parameters:
  max_diagnostic_questions: 12
  gap_threshold: 0.10
  critical_gap_threshold: 0.35
  fallback_current_level: 0.10
  unknown_grade_fallback: 0.50
  decay_half_life_days: 60.0


